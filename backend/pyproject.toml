[project]
name = "ai-blog-backend"
version = "0.1.0"
description = "ai-blog backend - FastAPI + SQLAlchemy + OpenAI SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.55.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "tiktoken>=0.7.0",
    "mcp>=1.27.1",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-deepseek>=0.1.0",
    "langgraph>=0.4.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.0",
    "cryptography>=48.0.0",
    "langchain-anthropic>=1.4.8",
    "sentence-transformers>=2.7.0",
    "falkordb>=1.6.2",
    "sentry-sdk[fastapi]>=2.66.1",
    "python-json-logger>=4.1.0",
    "portalocker>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# 并行（4 worker）+ 覆盖率统计；单进程调试加 -n0，跳覆盖率加 --no-cov
addopts = "-n4 --cov=src --cov-report=term-missing --no-cov-on-fail"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",        # 语法/未用 import/警告
  "I",                  # import 排序
  "UP",                 # pyupgrade（现代语法：Optional→|、deprecated import 等）
  "B",                  # bugbear（真 bug：可变默认参数、raise 缺 from 等）
  "SIM",                # 代码简化
  "RUF",                # ruff 专属
  "ASYNC",              # async 最佳实践
  "S",                  # bandit 安全（SQL 注入、硬编码密码、subprocess 等）
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 中文全角标点"歧义字符"——中文项目全是噪音
  "B008",                         # 函数调用做默认参数——FastAPI Depends() 惯例，无法避免
  "S101",                         # assert——后端用做内部不变式校验（非测试）
  "S105",                         # 假密码串——配置默认值/加密常量名误判
  "S110", "S112",                 # try-except pass/continue——已知有意吞的空 except
  "S603", "S607",                 # subprocess 部分路径——需传可执行名的正当场景
  "ASYNC109",                     # async 函数里 timeout——部分场景正当
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]             # 测试里用 assert 是正常的

[tool.ruff.format]
quote-style = "double"
