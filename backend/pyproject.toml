[project]
name = "ai-blog-backend"
version = "0.1.0"
description = "ai-blog backend - FastAPI + SQLAlchemy + OpenAI SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.55.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "chromadb>=1.0.0",
    "tiktoken>=0.7.0",
    "mcp>=1.27.1",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-deepseek>=0.1.0",
    "langgraph>=0.4.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.0",
    "cryptography>=48.0.0",
    "langchain-anthropic>=1.4.8",
    "sentence-transformers>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# 每次 pytest 自动统计 src 覆盖率并列出未覆盖行，让缺口一目了然（想跳过时加 --no-cov）。
addopts = "--cov=src --cov-report=term-missing --no-cov-on-fail"

[tool.ruff]
line-length = 120
target-version = "py311"
