<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1780" viewBox="0 0 2400 1780" role="img" aria-labelledby="title desc">
  <title id="title">AI 大脑当前流程、图谱结构与优化路线</title>
  <desc id="desc">从博客、文件和聊天进入 AI 大脑，经向量检索和信息抽取存入 FalkorDB；下方展示当前真实召回路径，以及从可靠入图到图谱检索、治理和可选三维图谱的优化路线。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <style>
      .bg { fill:#f8fafc; }
      .title { font: 700 44px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .subtitle { font: 400 22px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#475569; }
      .section { font: 700 28px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; }
      .label { font: 600 22px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#334155; text-anchor:middle; }
      .note { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#64748b; }
      .box { stroke:#94a3b8; stroke-width:2; rx:18; }
      .source { fill:#e0f2fe; stroke:#38bdf8; }
      .process { fill:#eef2ff; stroke:#818cf8; }
      .store { fill:#ecfdf5; stroke:#34d399; }
      .memory { fill:#fff7ed; stroke:#fb923c; }
      .recall { fill:#eff6ff; stroke:#60a5fa; }
      .todo { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:10 8; }
      .road { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:20; }
      .line { fill:none; stroke:#475569; stroke-width:3; marker-end:url(#arrow); }
      .line-blue { fill:none; stroke:#2563eb; stroke-width:4; marker-end:url(#arrowBlue); }
      .dash { fill:none; stroke:#64748b; stroke-width:3; stroke-dasharray:10 8; marker-end:url(#arrow); }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:24; }
      .legend-solid { stroke:#475569; stroke-width:3; }
      .legend-dash { stroke:#64748b; stroke-width:3; stroke-dasharray:10 8; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1780"/>
  <text x="90" y="82" class="title">AI 大脑：当前流程、数据结构与优化路线</text>
  <text x="90" y="122" class="subtitle">实线：当前已接通　　虚线：已有模型或页面，但尚未形成自动写入 / 检索闭环</text>
  <line x1="90" y1="154" x2="180" y2="154" class="legend-solid"/><text x="200" y="161" class="note">已接通</text>
  <line x1="320" y1="154" x2="410" y2="154" class="legend-dash"/><text x="430" y="161" class="note">待闭环</text>

  <rect x="70" y="200" width="1450" height="1060" class="panel"/>
  <text x="110" y="255" class="section">1. 当前运行流程</text>

  <text x="110" y="310" class="subtitle">内容来源</text>
  <rect x="120" y="340" width="220" height="94" class="box source"/>
  <text x="230" y="383" class="label">博客文章</text>
  <text x="230" y="413" class="small">手动加入知识库</text>
  <rect x="120" y="475" width="220" height="94" class="box source"/>
  <text x="230" y="518" class="label">上传文件</text>
  <text x="230" y="548" class="small">手动加入知识库</text>
  <rect x="120" y="650" width="220" height="94" class="box source"/>
  <text x="230" y="693" class="label">聊天记录</text>
  <text x="230" y="723" class="small">用户消息 + AI 回复</text>

  <path d="M340 387 H405 V475 H460" class="line"/>
  <path d="M340 522 H405 V475 H460" class="line"/>
  <rect x="460" y="425" width="230" height="100" class="box process"/>
  <text x="575" y="468" class="label">索引任务</text>
  <text x="575" y="498" class="small">清洗、切分、记录来源</text>
  <path d="M690 475 H745" class="line"/>
  <rect x="745" y="425" width="210" height="100" class="box process"/>
  <text x="850" y="468" class="label">Chunk</text>
  <text x="850" y="498" class="small">文档片段</text>
  <path d="M955 475 H1010" class="line"/>
  <rect x="1010" y="425" width="220" height="100" class="box process"/>
  <text x="1120" y="468" class="label">Embedding</text>
  <text x="1120" y="498" class="small">文本向量化</text>
  <path d="M1230 475 H1280" class="line"/>
  <rect x="1280" y="410" width="190" height="130" class="box store"/>
  <text x="1375" y="455" class="label">FalkorDB</text>
  <text x="1375" y="488" class="small">Chunk 向量索引</text>
  <text x="1375" y="516" class="small">cosine 相似度</text>

  <path d="M850 525 V595" class="line"/>
  <rect x="730" y="595" width="240" height="100" class="box process"/>
  <text x="850" y="638" class="label">LLM 信息抽取</text>
  <text x="850" y="668" class="small">light / deep</text>
  <path d="M340 697 H570 V760 H730" class="line"/>
  <rect x="470" y="715" width="200" height="90" class="box process"/>
  <text x="570" y="755" class="label">LLM 信息抽取</text>
  <text x="570" y="784" class="small">聊天记忆</text>
  <path d="M970 645 H1030 V770 H1080" class="line"/>
  <rect x="1080" y="720" width="250" height="100" class="box process"/>
  <text x="1205" y="763" class="label">归并 / 去重 / 时效</text>
  <text x="1205" y="793" class="small">按用户隔离</text>

  <path d="M1205 820 V875 H850 V915" class="line"/>
  <rect x="745" y="915" width="210" height="105" class="box memory"/>
  <text x="850" y="958" class="label">Entity 实体</text>
  <text x="850" y="988" class="small">人、主题、概念</text>
  <path d="M1205 820 V875 H1100 V915" class="dash"/>
  <rect x="995" y="915" width="210" height="105" class="box todo"/>
  <text x="1100" y="958" class="label">Fact 事实</text>
  <text x="1100" y="988" class="small">deep 才抽取；有时效</text>
  <path d="M1205 820 V875 H1350 V915" class="line"/>
  <rect x="1245" y="915" width="210" height="105" class="box memory"/>
  <text x="1350" y="958" class="label">Episode 事件</text>
  <text x="1350" y="988" class="small">文档 / 聊天摘要</text>
  <rect x="745" y="1070" width="210" height="105" class="box todo"/>
  <text x="850" y="1113" class="label">Preference 偏好</text>
  <text x="850" y="1143" class="small">暂无自动写入</text>
  <path d="M1100 1020 V1055 H850 V1070" class="dash"/>
  <path d="M955 965 H995" class="line"/>
  <text x="975" y="946" class="note" text-anchor="middle">实体关联</text>
  <path d="M1205 965 H1245" class="dash"/>
  <text x="1225" y="946" class="note" text-anchor="middle">参与者</text>
  <path d="M850 1020 V1060" class="dash"/>
  <text x="867" y="1048" class="note">RELATES_TO 尚未生成</text>

  <rect x="70" y="1305" width="1450" height="340" class="panel"/>
  <text x="110" y="1360" class="section">2. 当前回答时真正发生的检索</text>
  <rect x="130" y="1420" width="190" height="96" class="box recall"/>
  <text x="225" y="1462" class="label">用户问题</text>
  <text x="225" y="1492" class="small">聊天输入</text>
  <path d="M320 1468 H390" class="line-blue"/>
  <rect x="390" y="1420" width="210" height="96" class="box recall"/>
  <text x="495" y="1462" class="label">问题向量化</text>
  <text x="495" y="1492" class="small">Embedding</text>
  <path d="M600 1468 H670" class="line-blue"/>
  <rect x="670" y="1420" width="220" height="96" class="box recall"/>
  <text x="780" y="1462" class="label">Chunk Top-K</text>
  <text x="780" y="1492" class="small">只做向量召回</text>
  <path d="M890 1468 H960" class="line-blue"/>
  <rect x="960" y="1420" width="235" height="96" class="box recall"/>
  <text x="1077" y="1462" class="label">上下文</text>
  <text x="1077" y="1492" class="small">Chunk 原文 + 实体名</text>
  <path d="M1195 1468 H1265" class="line-blue"/>
  <rect x="1265" y="1420" width="190" height="96" class="box recall"/>
  <text x="1360" y="1462" class="label">AI 回答</text>
  <text x="1360" y="1492" class="small">Chat Agent</text>
  <text x="130" y="1585" class="note">当前不会检索：Fact、Episode、Preference、多跳关系、社区摘要。</text>

  <rect x="1570" y="200" width="760" height="1060" class="panel"/>
  <text x="1610" y="255" class="section">3. 图谱结构：设计与现状</text>
  <text x="1610" y="300" class="subtitle">橙色节点已有写入；虚线节点或关系尚未自动形成。</text>

  <rect x="1850" y="355" width="200" height="100" class="box memory"/>
  <text x="1950" y="398" class="label">Document</text>
  <text x="1950" y="428" class="small">来源文档</text>
  <rect x="1630" y="535" width="200" height="100" class="box store"/>
  <text x="1730" y="578" class="label">Chunk</text>
  <text x="1730" y="608" class="small">带向量</text>
  <rect x="2070" y="535" width="200" height="100" class="box memory"/>
  <text x="2170" y="578" class="label">Entity</text>
  <text x="2170" y="608" class="small">实体</text>
  <path d="M1880 455 L1790 535" class="line"/>
  <text x="1818" y="489" class="note">SOURCES</text>
  <path d="M1830 585 H2070" class="line"/>
  <text x="1950" y="566" class="note" text-anchor="middle">MENTIONS</text>
  <path d="M2050 405 L2125 535" class="line"/>
  <text x="2115" y="481" class="note">SOURCES</text>

  <rect x="1830" y="760" width="200" height="100" class="box todo"/>
  <text x="1930" y="803" class="label">Fact</text>
  <text x="1930" y="833" class="small">事实 + 时效</text>
  <path d="M2070 635 L1990 760" class="dash"/>
  <text x="2043" y="709" class="note">SUBJECT / OBJECT</text>
  <path d="M1930 760 L1930 635" class="dash"/>
  <text x="1942" y="704" class="note">SOURCES</text>
  <path d="M1830 810 H1740 V980 H2070" class="dash"/>
  <text x="1800" y="961" class="note">SUPERSEDES</text>

  <rect x="1630" y="980" width="200" height="100" class="box memory"/>
  <text x="1730" y="1023" class="label">Episode</text>
  <text x="1730" y="1053" class="small">事件 / 对话</text>
  <path d="M1830 1030 H2070" class="dash"/>
  <text x="1950" y="1011" class="note" text-anchor="middle">INVOLVES（未自动填充）</text>
  <path d="M2170 635 V740 H2260 V930 H2170" class="dash"/>
  <text x="2190" y="724" class="note">RELATES_TO（未生成）</text>

  <rect x="1920" y="1135" width="200" height="90" class="box todo"/>
  <text x="2020" y="1174" class="label">Preference</text>
  <text x="2020" y="1204" class="small">偏好（未自动写入）</text>

  <text x="1570" y="1335" class="section">4. 推荐优化顺序</text>
  <path d="M1750 1515 H1775" class="line-blue"/>
  <path d="M1940 1515 H1965" class="line-blue"/>
  <path d="M2150 1515 H2175" class="line-blue"/>
  <rect x="1585" y="1390" width="165" height="250" class="road"/>
  <text x="1667" y="1440" class="label">P1 可靠入图</text>
  <text x="1667" y="1490" class="small">deep 事实</text>
  <text x="1667" y="1522" class="small">偏好、来源、置信度</text>
  <rect x="1775" y="1390" width="165" height="250" class="road"/>
  <text x="1857" y="1440" class="label">P2 真实关系</text>
  <text x="1857" y="1490" class="small">实体规范化</text>
  <text x="1857" y="1522" class="small">RELATES_TO</text>
  <text x="1857" y="1552" class="small">/ INVOLVES</text>
  <rect x="1965" y="1390" width="185" height="250" class="road"/>
  <text x="2057" y="1440" class="label">P3 图谱检索</text>
  <text x="2057" y="1490" class="small">向量种子 → 扩展</text>
  <text x="2057" y="1522" class="small">事实、事件、偏好</text>
  <text x="2057" y="1552" class="small">统一重排</text>
  <rect x="2175" y="1390" width="140" height="250" class="road"/>
  <text x="2245" y="1440" class="label">P4 / P5</text>
  <text x="2245" y="1490" class="small">治理评测</text>
  <text x="2245" y="1522" class="small">社区、3D</text>
  <text x="1585" y="1690" class="subtitle">先 P1 → P3，再考虑 GraphRAG 社区聚类与 3D。</text>
  <text x="1585" y="1730" class="subtitle">否则只会得到“点很多、关系很少”的可视化。</text>
</svg>
